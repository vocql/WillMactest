{id:"welcome",t:"Welcome",h:`
<p>This handbook is the single source of truth for Will Mac Community staff. Read it fully before you take any action, and come back whenever you’re unsure.</p>
<div class="box"><b class="h">🌴 Our role</b>To protect the community and make it a better place.</div>
<h2>How to use it</h2>
<ul><li>Use <b>Pages</b> (top bar on phones) or the sidebar to jump around.</li><li>Use <b>Back / Next</b> at the bottom to read in order.</li><li>The <b>Message presets</b> page has copy-ready replies for appeals and applications.</li></ul>
<h2>Quick links</h2>
<ul><li>Appeal page for members: <a href="https://voqcl.com/willmacgta/appeal/">voqcl.com/willmacgta/appeal</a></li><li>Staff dashboard: <a href="../applications/">/applications/</a></li></ul>
<div class="box warn"><b class="h">Unsure? Ask.</b>A second opinion is always better than a wrong action. Ping a Lead or Admin.</div>`},
{id:"rules",t:"Staff Rules",h:`
<p>These 14 rules apply to every staff member, including the owner.</p>
<div id="rl"></div>
<div class="box">By keeping your staff role, you agree to follow these rules.</div>`},
{id:"roles",t:"Roles & permissions",h:`
<p>What each role may do. Never use a permission you weren’t given. If you need something done, ask the next role up.</p>
<div class="tbl"><table><tr><th>Action</th><th>Mod</th><th>Lead</th><th>Admin</th></tr>
<tr><td>Delete messages, warn</td><td class="y">Yes</td><td class="y">Yes</td><td class="y">Yes</td></tr>
<tr><td>Timeout (up to 24h)</td><td class="y">Yes</td><td class="y">Yes</td><td class="y">Yes</td></tr>
<tr><td>Timeout (over 24h), kick</td><td class="n">Ask Lead</td><td class="y">Yes</td><td class="y">Yes</td></tr>
<tr><td>Ban</td><td class="n">Ask Lead</td><td class="y">Yes</td><td class="y">Yes</td></tr>
<tr><td>Review appeals (not your own)</td><td class="y">Yes</td><td class="y">Yes</td><td class="y">Yes</td></tr>
<tr><td>Review applications</td><td class="n">View only</td><td class="y">Yes</td><td class="y">Yes</td></tr>
<tr><td>Open/close applications, retry failed actions</td><td class="n">No</td><td class="n">No</td><td class="y">Yes</td></tr>
<tr><td>Manage staff, access, roles</td><td class="n">No</td><td class="n">No</td><td class="y">Yes</td></tr></table></div>
<div class="box warn"><b class="h">Editable defaults</b>Adjust this table to match your real permissions before sharing it.</div>
<h2>Who handles what</h2>
<ul><li><b>Moderators</b> watch chat, handle reports and issue light punishments.</li><li><b>Lead Moderators</b> guide mods, approve bigger actions and review appeals.</li><li><b>Admins</b> run the dashboard, settings, serious cases and staff changes.</li></ul>`},
{id:"strikes",t:"4-strike system",h:`
<p>Strikes keep punishments fair and consistent. Always check the member’s history first, then pick the next step.</p>
<div class="tbl"><table><tr><th>Strike</th><th>Action</th><th>Notes</th></tr>
<tr><td><b>1</b></td><td>Verbal or written warning</td><td>Explain the rule that was broken.</td></tr>
<tr><td><b>2</b></td><td>Timeout, 1 to 24 hours</td><td>Log evidence.</td></tr>
<tr><td><b>3</b></td><td>Timeout up to 7 days or kick</td><td>Lead approval for 3+ days.</td></tr>
<tr><td><b>4</b></td><td>Permanent ban</td><td>Lead or Admin issues it.</td></tr></table></div>
<h2>Rules of strikes</h2>
<ul><li>Strikes are logged with a reason and evidence every time.</li><li>Strikes 1 and 2 may expire after 30 clean days at staff discretion; strikes 3 and 4 never expire.</li><li>Match the punishment to the behaviour. A small first mistake is not a timeout.</li><li>Staff may skip steps for serious behaviour (next page).</li></ul>`},
{id:"severe",t:"Instant bans",h:`
<p>These skip the strike ladder. Act fast, collect evidence, then tell an Admin.</p>
<div class="box bad"><b class="h">Instant ban</b><ul><li>Raiding or coordinated spam</li><li>Doxxing or sharing private information</li><li>Threats of violence or self-harm used to harass</li><li>Hate speech, slurs, targeted harassment</li><li>NSFW or illegal content, scams, malicious links</li><li>Ban evasion or alt accounts to dodge punishment</li></ul></div>
<h2>Steps</h2>
<ol class="steps"><li>Remove the content and stop the spread.</li><li>Screenshot messages, IDs and timestamps before banning.</li><li>Ban, then post the case in the staff channel.</li><li>Escalate threats, doxxing and raids to the Admins immediately.</li></ol>
<p>Appeals for these are reviewed by an Admin only and may be auto-denied.</p>`},
{id:"reports",t:"Reports & evidence",h:`
<h2>Handling a report</h2>
<ol class="steps"><li>Read the report and acknowledge it in a reasonable time.</li><li>Check messages, screenshots and surrounding context.</li><li>Look up the member’s history for earlier strikes.</li><li>Decide using the strike ladder, then log your action.</li><li>Reply to the reporter if it’s appropriate. Never share who else was involved.</li></ol>
<h2>Good evidence</h2>
<ul><li>Full screenshots with name, date and channel visible</li><li>Message links and user IDs</li><li>Notes on what was said before and after</li></ul>
<div class="box warn"><b class="h">Never</b>Claim to have seen evidence you haven’t, or act on a report involving you. Hand it to another moderator.</div>`},
{id:"actions",t:"Moderation how-to",h:`
<h2>Warn</h2><p>Use for first-time or minor issues. Name the rule, keep it calm, log it.</p>
<h2>Timeout</h2><p>Use when someone needs a cool-down. Choose the shortest length that works and give a reason.</p>
<h2>Kick</h2><p>Removes the member but they can rejoin. Use for repeated issues where a ban is too much.</p>
<h2>Ban</h2><p>For strike 4 or instant-ban behaviour. Always include evidence in the log.</p>
<h2>Every action needs</h2>
<ul><li>A clear reason (not “no” or “ok”)</li><li>Evidence or message links</li><li>A log entry so others can see the history</li></ul>
<div class="box"><b class="h">Fairness check</b>Would you do the same to your best friend? If not, stop and ask someone else.</div>`},
{id:"appeals",t:"Appeal system",h:`
<p>Members appeal on the appeal page. A <b>single reviewer</b> makes the decision. There is no staff voting.</p>
<h2>The flow</h2>
<ol class="steps"><li>Member sends one appeal on the appeal page.</li><li>Appeal shows up in the dashboard under <b>Appeals</b>.</li><li>One Moderator, Lead or Admin claims it with “I’ll review this”.</li><li>Reviewer checks history, then accepts, denies, asks for more info or escalates.</li><li>The member sees the result and your reason on their appeal page.</li></ol>
<h2>Appeal rules for staff</h2>
<ol>
<li><b>Point members to the appeal page.</b> Don’t debate punishments in chat or DMs.</li>
<li><b>Keep appeals out of DMs.</b> Never discuss an appeal privately with the member.</li>
<li><b>Don’t judge your own punishments.</b> If you issued it, another staff member reviews it.</li>
<li><b>Check history first.</b> Use Load from Discord via ViceGuard and User Lookup.</li>
<li><b>Give a clear reason.</b> It is required and members can see it.</li>
<li><b>Ask, don’t guess.</b> Use Ask for more info; the member gets a DM and replies on the appeal page.</li>
<li><b>Escalate serious cases.</b> Threats, doxxing, NSFW, raids and alts go to the Admins.</li>
<li><b>Keep notes private.</b> Members never see staff notes or dashboard screenshots.</li>
<li><b>Stay active.</b> Going away? Tell @voqcl.</li>
<li><b>Protect your account.</b> Turn on 2FA, never share your login, and tell a Lead at once if it’s compromised.</li></ol>
<div class="box"><b class="h">Good to know</b><ul><li>One open appeal per member. After a denial they wait 7 days.</li><li>ViceGuard can only DM members sharing a server with it. If a DM fails, the dashboard shows it and the result still appears on their appeal page.</li><li>If an unban or timeout removal fails, an Admin can press Retry. It never applies twice.</li></ul></div>`},
{id:"review",t:"Reviewing an appeal",h:`
<h2>Checklist</h2>
<p>In the dashboard, open the appeal and use the <b>Appeal review</b> box: pick a message preset, edit it, then press <b>Accept appeal</b>, <b>Deny appeal</b>, <b>Ask for more info</b> or <b>Escalate to admin</b>. A reason is required.</p>
<ol class="steps"><li>Make sure you didn’t issue the punishment (the dashboard blocks you if you did).</li><li>Open the logs and screenshots for the original case.</li><li>Check history and strikes.</li><li>Read the appeal: do they understand what happened and what changes?</li><li>Pick an outcome and write a clear reason.</li></ol>
<h2>Outcomes</h2>
<div class="tbl"><table><tr><th>Outcome</th><th>Use when</th></tr>
<tr><td><b>Accept</b></td><td>Punishment was wrong, or they show real accountability and the offence was minor. Member goes on probation for 1 to 2 weeks.</td></tr>
<tr><td><b>Deny</b></td><td>Evidence supports the punishment, or the appeal blames others.</td></tr>
<tr><td><b>Ask for more info</b></td><td>You can’t decide without more detail or evidence.</td></tr>
<tr><td><b>Escalate</b></td><td>Severe, unclear or involves staff. Ask an Admin.</td></tr></table></div>
<div class="box warn"><b class="h">Probation</b>Any rule break while on probation means an instant ban.</div>
<div class="box bad"><b class="h">Conflicts</b>If you know the member or issued the punishment, don’t take the review. Leave it for someone else.</div>`},
{id:"presets",t:"Message presets",h:`
<p>Tap <b>Copy</b>, paste it into the decision box, and change anything that needs it. <b>{name}</b> is the member’s name.</p>
<div class="tabs" id="tabs"></div><div id="pl"></div>`},
{id:"conduct",t:"Conduct & safety",h:`
<h2>Be professional</h2>
<ul><li>Stay calm. Never insult, intimidate or humiliate members.</li><li>Keep moderation talk in staff channels.</li><li>Accept feedback and own your mistakes.</li></ul>
<h2>Account safety</h2>
<ul><li>Enable 2-Factor Authentication.</li><li>Never share your login or dashboard screenshots.</li><li>If compromised, tell a Lead right away.</li></ul>
<h2>Consequences</h2>
<p>Misconduct may lead to a warning, loss of permissions or removal from staff. Serious abuse may mean immediate removal.</p>
<h2>Complaints about staff</h2>
<p>Anyone can report staff, including the owner. Complaints are judged on evidence, not rank, and honest reports are never punished.</p>
<div class="box">Thank you for keeping the community strong. 🌴</div>`}
];

function presets(){
  $('tabs').innerHTML=Object.keys(PRESETS).map(function(k){return '<button type="button" data-k="'+k+'" class="'+(k===tab?'on':'')+'">'+k+'</button>'}).join('');
  $('pl').innerHTML=PRESETS[tab].map(function(x,i){return '<div class="pre"><strong>'+x[0]+'</strong><p>'+x[1]+'</p><button type="button" data-c="'+i+'">Copy</button></div>'}).join('');
}
function go(i){
  cur=Math.max(0,Math.min(P.length-1,i));var p=P[cur];
  $('main').innerHTML='<div class="pg">Page '+(cur+1)+' of '+P.length+'</div><h1>'+p.t+'</h1>'+p.h;
  if(EMB)[].forEach.call(document.querySelectorAll('main a'),function(a){a.target='_blank';a.rel='noopener'});
  if(p.id==='rules')$('rl').innerHTML=R.map(function(r,i){var a=r.split('|');return '<div class="rule"><i>'+(i+1)+'</i><div><b>'+a[0]+'</b><br><span style="color:var(--muted)">'+a[1]+'</span></div></div>'}).join('');
  if(p.id==='presets'){presets();
    $('tabs').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.dataset.k;presets()}};
    $('pl').onclick=function(e){var b=e.target.closest('button');if(b)copy(PRESETS[tab][+b.dataset.c][1])};}
  [].forEach.call(side.children,function(b,j){b.classList.toggle('on',j===cur)});
  $('prev').disabled=cur===0;$('next').disabled=cur===P.length-1;$('cnt').textContent=(cur+1)+' / '+P.length;
  if(location.hash!=='#'+p.id)history.replaceState(null,'','#'+p.id);
  window.scrollTo(0,0);
}
$('prev').onclick=function(){go(cur-1)};$('next').onclick=function(){go(cur+1)};
var h=location.hash.slice(1),s=P.findIndex(function(p){return p.id===h});go(s<0?0:s);
</script>
</body>
